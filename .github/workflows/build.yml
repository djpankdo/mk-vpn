name: build

# Builda a imagem multi-arch e publica no Docker Hub a cada push na main.
# Assim o Codespace deixa de ser necessário para gerar a imagem.
#
# Segredos necessários em Settings → Secrets and variables → Actions:
#   DOCKERHUB_USERNAME  — seu usuário do Docker Hub
#   DOCKERHUB_TOKEN     — token de acesso (Docker Hub → Account Settings → Personal access tokens)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mk-vpn

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checagem de sintaxe dos scripts
        run: |
          bash -n rootfs/usr/local/bin/entrypoint.sh
          bash -n rootfs/usr/local/bin/vpnc-hook.sh
          bash -n rootfs/usr/local/bin/mkvpn-status.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadados / tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          # O RouterOS em RB5009/CCR2004/hAP ax é arm64. amd64 fica para CHR
          # e para você testar no próprio Codespace.
          platforms: linux/arm64,linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
