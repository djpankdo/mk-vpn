name: build

# Builda a imagem multi-arch e, quando houver credenciais, publica no Docker Hub.
# Assim o Codespace deixa de ser necessário para gerar a imagem.
#
# Enquanto os segredos abaixo não existirem, o workflow ainda builda as duas
# arquiteturas (serve de teste de compilação) e apenas não publica:
#   DOCKERHUB_USERNAME  — seu usuário do Docker Hub
#   DOCKERHUB_TOKEN     — token de acesso (Docker Hub → Account Settings → Personal access tokens)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checagem de sintaxe dos scripts
        run: |
          bash -n rootfs/usr/local/bin/entrypoint.sh
          bash -n rootfs/usr/local/bin/vpnc-hook.sh
          bash -n rootfs/usr/local/bin/mkvpn-status.sh

      # O nome da imagem não pode depender do segredo: sem ele a tag sairia
      # vazia e o metadata-action falharia mesmo num build sem publicação.
      - name: Decidir imagem e se publica
        id: cfg
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${DH_USER:-$OWNER}"
          echo "image=${owner,,}/mk-vpn" >> "$GITHUB_OUTPUT"
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ] && [ "$EVENT" != "pull_request" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            if [ -z "$DH_TOKEN" ]; then
              echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN ausentes — buildando sem publicar."
            fi
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadados / tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.cfg.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          # O RouterOS em RB5009/CCR2004/hAP ax é arm64. amd64 fica para CHR
          # e para você testar no próprio Codespace.
          platforms: linux/arm64,linux/amd64
          push: ${{ steps.cfg.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
